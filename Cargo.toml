[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
mho-scpi = { path = "crates/mho-scpi" }
mho-driver = { path = "crates/mho-driver" }
mho-dsp = { path = "crates/mho-dsp" }
mho-service = { path = "crates/mho-service" }
mho-server = { path = "crates/mho-server" }
mho-gui = { path = "crates/mho-gui" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_plot = "0.37"
futures = "0.3"
nix = { version = "0.31", features = ["ioctl", "fs"] }
nusb = "0.2"
png = "0.18"
realfft = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rustyline = "17"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tokio-util = "0.7"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
